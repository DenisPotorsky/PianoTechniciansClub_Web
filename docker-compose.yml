services:
  backend:
    build: ./backend
    container_name: ptc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/piano_club.db:/app/piano_club.db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: ptc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  bot:
    build: ./bot_simple
    container_name: ptc-bot
    restart: unless-stopped
    env_file:
      - ./bot_simple/.env
    volumes:
      - ./backend/piano_club.db:/app/../backend/piano_club.db
    depends_on:
      - backend
